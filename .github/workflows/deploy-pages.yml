name: Deploy Therdal Website to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - "frontend/**"
      - "index.html"
      - "CNAME"
      - ".nojekyll"
      - "package.json"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "gh-pages-deploy"
  cancel-in-progress: false

jobs:
  deploy-gh-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Pages builder & link integrity
        run: npm run website:test

      - name: Build & push static bundle to gh-pages (therdal.org)
        run: npm run website:deploy
