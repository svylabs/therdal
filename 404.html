<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>404 — Page Not Found | Therdal</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg?v=2" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <style>
    :root {
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: radial-gradient(circle at 50% 0%, #182338 0%, #0d1017 62%);
      color: #e4e8f2;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      max-width: 520px;
      width: 100%;
      background: #151923;
      border: 1px solid rgba(170, 199, 255, 0.16);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }
    .code {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      background: rgba(170, 199, 255, 0.12);
      color: #aac7ff;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }
    h1 {
      margin: 0 0 0.75rem;
      font-size: 1.85rem;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0 0 1.75rem;
      color: #9aa5bd;
      line-height: 1.6;
      font-size: 0.98rem;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.7rem 1.25rem;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.92rem;
      text-decoration: none;
      transition: opacity 0.15s ease;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .btn-primary {
      background: #aac7ff;
      color: #0b1b36;
    }
    .btn-secondary {
      background: rgba(170, 199, 255, 0.12);
      color: #d6e3ff;
      border: 1px solid rgba(170, 199, 255, 0.22);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="code">404 · Not Found</div>
    <h1>Page not found</h1>
    <p>
      The page you requested does not exist on <strong>therdal.org</strong>.
      Explore the protocol overview, documentation, or interactive voting app below.
    </p>
    <div class="actions">
      <a href="/" class="btn btn-primary" data-root-link="">Protocol Home</a>
      <a href="/docs.html" class="btn btn-secondary" data-root-link="docs.html">Documentation</a>
      <a href="/frontend/index.html" class="btn btn-secondary" data-root-link="frontend/index.html">Launch App</a>
    </div>
  </main>
  <script>
    (function () {
      if (/\.github\.io$/i.test(window.location.hostname)) {
        var segs = window.location.pathname.split("/").filter(Boolean);
        var base = segs.length > 0 ? "/" + segs[0] + "/" : "/";
        document.querySelectorAll("[data-root-link]").forEach(function (a) {
          a.setAttribute("href", base + (a.getAttribute("data-root-link") || ""));
        });
      }
    })();
  </script>
  <!-- Canonical home: https://therdal.org/ -->
</body>
</html>
