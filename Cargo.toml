[workspace]
resolver = "2"
members = [
    "circuits",
    "publisher",
    "archive",
    "prover",
    "cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
bincode = "1.3"
clap = { version = "4.6", features = ["derive"] }
hex = "0.4"
k256 = { version = "0.13", features = ["ecdsa"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sha3 = "0.12"
thiserror = "2.0"
