[workspace]
members = [
    ".",
    "program"
]

[package]
name = "zk-stark-voting"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = "0.8"
sha3 = "0.12.0"
thiserror = "2.0.18"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
serde_json = "1.0"
hex = "0.4"
sp1-sdk = { version = "6.3.1", optional = true }
tokio = { version = "1.45.2", features = ["full"], optional = true }

[features]
default = ["prover"]
prover = ["dep:sp1-sdk", "dep:tokio"]

[build-dependencies]
sp1-helper = "6.3.1"

[profile.dev.package."*"]
opt-level = 3
